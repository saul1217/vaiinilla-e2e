name: e2e
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }
  workflow_dispatch:
permissions: { contents: read }
# Un solo run a la vez: las pruebas de domicilio prenden/apagan banderas en usagi-pruebas.
concurrency: { group: e2e-develop, cancel-in-progress: false }
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          QA_FIREBASE_DEV_PASSWORD: ${{ secrets.QA_FIREBASE_DEV_PASSWORD }}
          QA_CLIENTE_EMAIL: ${{ secrets.QA_CLIENTE_EMAIL }}
          QA_CLIENTE_PASSWORD: ${{ secrets.QA_CLIENTE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
